<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FoodHub Admin</title><link rel="stylesheet" href="admin.css"></head><body><header><div class="wrap nav"><h1>FoodHub Admin</h1><div><a href="/">View Website</a> <button id="logout">Logout</button></div></div></header><main class="wrap"><section id="login" class="card login"><h2>Admin Login</h2><form id="loginForm"><input id="email" type="email" placeholder="Admin email" required><input id="password" type="password" placeholder="Password" required><button>Login</button></form><p id="error"></p></section><section id="dash" class="hidden"><div class="stats"><div><small>Foods</small><b id="foodsN">0</b></div><div><small>Orders</small><b id="ordersN">0</b></div><div><small>Customers</small><b id="customersN">0</b></div><div><small>Revenue</small><b id="revenueN">৳0</b></div></div><section class="card"><div class="title"><div><h2>Food Management</h2><p>Add, edit and delete menu items.</p></div><button onclick="openFood()">+ Add Food</button></div><div id="foodList" class="grid"></div></section><section class="card"><div class="title"><div><h2>Users</h2><p>Customer accounts and activity.</p></div></div><div id="userList"></div></section><section class="card"><div class="title"><div><h2>Customer Chat</h2><p>Select a customer and reply.</p></div></div><div class="chatLayout"><div id="chatList" class="chatList"></div><div class="adminChat"><div id="chatTitle" class="chatTitle">Select a conversation</div><div id="adminMessages" class="chat-messages"></div><form id="adminChatForm" class="chat-form hidden"><input id="adminChatInput" maxlength="2000" placeholder="Reply to customer..." required><button>Send</button></form></div></div></section><section class="card"><h2>Orders</h2><div id="orderList"></div></section></section></main><div id="modal" class="modal hidden"><div class="modalCard"><button class="close" onclick="closeFood()">×</button><h2 id="formTitle">Add Food</h2><form id="foodForm"><input id="foodId" type="hidden"><input id="foodName" placeholder="Food name" required><textarea id="foodDesc" placeholder="Description" required></textarea><input id="foodPrice" type="number" min="0" step=".01" placeholder="Price" required><input id="foodImage" type="url" placeholder="Image URL" required><button>Save Food</button></form></div></div><script src="admin.js"></script></body></html>
